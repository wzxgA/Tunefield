[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tunefield"
version = "0.1.0"
description = "Tunefield · 领域专属小模型训练平台：上传数据、观察训练、使用模型"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # F1 起需要：FastAPI 单进程承载 API + 内嵌队列 + 前端托管
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",  # T1 上传接口（multipart 表单）运行必需
]

[project.optional-dependencies]
# 数据管线（T2 结构化解析）
pipeline = [
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    # tree-sitter 核心与各语法包需配对：0.26 起 capsule API 移除，锁 <0.26
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-cpp>=0.22",
    "tree-sitter-rust>=0.23",
]
# 训练引擎（T7 微调 / T13 从零预训练），版本以 T0 实测定版为准
# torch 经 [tool.uv.sources] 从 PyTorch 官方 cu128 源解析（Windows 上 PyPI 的 torch 是 CPU 版）
train = [
    "transformers>=4.44,<4.47",
    "peft>=0.12",
    "bitsandbytes>=0.43; platform_system != 'Windows' or python_version < '3.12'",
    "accelerate>=0.33",
    "numpy>=1.26",
    "torch>=2.2",
    "llamafactory>=0.7.1",
    "pyarrow>=15,<18",
    "datasets>=2.14.6,<3",
    "bitsandbytes>=0.43",
]
# 开发与测试
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
tunefield = "tunefield.cli:main"

[tool.setuptools.packages.find]
include = ["tunefield*"]

# torch：从 PyTorch 官方 CUDA 源（cu128）解析，而非 PyPI 的 CPU 版
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
