# Tunefield 指令模板 · 抽问型
#
# 从块内抽取关键句（启发式）构造 question → answer 对：answer 为关键句原文，
# input 附带答案句前的背景上下文（≤160 字）供模型推理。
#
# [qa] strategy 取值：
#   salient_sentence （默认）优先含书名号/引号/数字单位/年份等实体感的句子
#   first_sentence   固定取块首句
# 可改：instruction / strategy；新增模板=在 templates/ 下复制此文件改名并修改。

[template]
name = 抽问
kind = qa
instruction = 你是{domain}领域的问答助手，请依据背景中的原文，用原文句子作答。

[qa]
strategy = salient_sentence
