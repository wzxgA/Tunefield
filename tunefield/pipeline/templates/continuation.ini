# Tunefield 指令模板 · 续写型（默认）
#
# 可编辑：改 instruction 文案即改变样本引导语；文件保存在 pipeline/templates/，
# 之后 build/预览都会读到。{domain} 在渲染时替换为数据集/领域名。
#
# 字段说明：
#   [template]
#   name        = 界面展示名（可改中文）
#   kind        = continuation | qa（决定渲染逻辑，续写固定 continuation）
#   instruction = 领域引导语，作为样本的 instruction 字段
# output 取整块正文（学风格与表达，是默认最稳的领域适配手段）。

[template]
name = 续写
kind = continuation
instruction = 你是{domain}领域的写作助手。请以与下列正文一致的{domain}领域风格续写，不要解释，只输出正文。
